<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Captain call thumbnail</title>
  <desc id="desc">YouTube thumbnail source for Deadline XI captaincy videos.</desc>
  <rect width="1280" height="720" fill="#07111F"/>
  
  <!-- Subtle Background Pitch Grid -->
  <g opacity=".12" stroke="#F7F7F2" stroke-width="3" fill="none">
    <path d="M54 54h1172v612H54z"/>
    <path d="M640 54v612"/>
    <circle cx="640" cy="360" r="92"/>
  </g>
  
  <!-- Dynamic Diagonal Split Panel -->
  <path d="M720 0h560v720H580Z" fill="#091826" opacity="0.85" stroke="#12B76A" stroke-width="4"/>
  
  <!-- Left Header Tag -->
  <rect x="54" y="72" width="366" height="70" rx="8" fill="#12B76A"/>
  <text x="82" y="121" font-family="Inter-Soccer, Arial, sans-serif" font-size="40" font-weight="900" fill="#07111F">DEADLINE XI</text>
  
  <!-- Headline Text (Contrasting Fonts) -->
  <text x="70" y="310" font-family="WORLD-Condensed, Bigstage, Impact, sans-serif" font-size="132" fill="#F7F7F2">CAPTAIN</text>
  <text x="70" y="446" font-family="Inter-Soccer Outline, Inter-Soccer, Bigstage, sans-serif" font-size="138" font-weight="900" fill="#F5B841">LOCK?</text>
  
  <!-- Right Side Mini FUT Card -->
  <path d="M800 130h320l30 30v320l-30 30H800l-30-30V160L800 130Z" fill="#0D2232" stroke="#273142" stroke-width="6"/>
  <circle cx="960" cy="260" r="90" fill="#091826" stroke="#12B76A" stroke-width="4"/>
  <text x="960" y="295" text-anchor="middle" font-family="WORLD-Condensed, Bigstage, sans-serif" font-size="120" fill="#F7F7F2">?</text>
  
  <!-- Red Alert Chip inside Card -->
  <rect x="830" y="380" width="260" height="60" rx="8" fill="#EF4444"/>
  <text x="960" y="422" text-anchor="middle" font-family="Manuver, Arial, sans-serif" font-size="30" font-weight="900" fill="#F7F7F2">AANKH BAND?</text>
  
  <!-- Bottom Accent Text -->
  <text x="70" y="620" font-family="Manuver, Arial, sans-serif" font-size="42" font-weight="900" fill="#12B76A">PAPA RANJEET KA DIRECT CALL</text>
</svg>
